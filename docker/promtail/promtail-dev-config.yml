# Used by compose.yml (dev) — tails the log file written by logback FILE_JSON appender.
# The ./logs directory from the host is bind-mounted at /logs inside this container.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: holiday-notificator
    static_configs:
      - targets:
          - localhost
        labels:
          job: holiday-notificator
          application: holiday-notificator
          env: dev
          __path__: /logs/app.json
    pipeline_stages:
      - json:
          expressions:
            message:    message
            level:      level
            logger:     logger_name
            country:    country
            notif_date: notificationDate
      - labels:
          level:
          logger:
          country:
          notif_date:
      - output:
          source: message
