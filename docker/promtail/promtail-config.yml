# Used by docker-compose.yml (full) — discovers the app container via Docker socket
# AND reads the shared log volume written by logback FILE_JSON appender.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # File-based: reads JSON log file from shared volume (most reliable)
  - job_name: event-reminder-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: event-reminder
          application: event-reminder
          env: prod
          __path__: /app/logs/app.json
    pipeline_stages:
      - json:
          expressions:
            message:    message
            level:      level
            logger:     logger_name
            country:    country
            notif_date: notificationDate
            timestamp:  '"@timestamp"'
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          logger:
          country:
          notif_date:
      - output:
          source: message

  # Docker socket: catches all other container logs (postgres, etc.)
  - job_name: docker-infra
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "app"
        action: drop   # app logs come from file scrape above
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: docker-infra
