databaseChangeLog:
  - changeSet:
      id: 003-create-events
      author: bakanov
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: VARCHAR(26)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_user
                    references: users(id)
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: event_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_recurring
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: recurrence_type
                  type: VARCHAR(20)
                  defaultValue: "NONE"
                  constraints:
                    nullable: false
              - column:
                  name: recurrence_interval
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: recurrence_end_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: next_occurrence_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createTable:
            tableName: event_labels
            columns:
              - column:
                  name: event_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_labels_event
                    references: events(id)
                    deleteCascade: true
              - column:
                  name: label_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_labels_label
                    references: labels(id)
                    deleteCascade: true
        - addPrimaryKey:
            tableName: event_labels
            columnNames: event_id, label_id
            constraintName: pk_event_labels
        - createIndex:
            tableName: events
            indexName: idx_events_user_next_occurrence
            columns:
              - column:
                  name: user_id
              - column:
                  name: next_occurrence_at
