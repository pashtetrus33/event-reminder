databaseChangeLog:
  - changeSet:
      id: 004-create-notification-rules
      author: bakanov
      changes:
        - createTable:
            tableName: notification_rules
            columns:
              - column:
                  name: id
                  type: VARCHAR(26)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notification_rules_event
                    references: events(id)
                    deleteCascade: true
              - column:
                  name: channel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: notify_type
                  type: VARCHAR(20)
                  defaultValue: "BEFORE"
                  constraints:
                    nullable: false
              - column:
                  name: notify_before_minutes
                  type: INT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
