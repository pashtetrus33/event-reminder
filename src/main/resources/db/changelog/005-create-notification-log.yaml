databaseChangeLog:
  - changeSet:
      id: 005-create-notification-log
      author: bakanov
      changes:
        - createTable:
            tableName: notification_log
            columns:
              - column:
                  name: id
                  type: VARCHAR(26)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notification_log_event
                    references: events(id)
                    deleteCascade: true
              - column:
                  name: rule_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notification_log_rule
                    references: notification_rules(id)
                    deleteCascade: true
              - column:
                  name: channel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_for
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "PENDING"
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: notification_log
            indexName: idx_notification_log_scheduled_status
            columns:
              - column:
                  name: scheduled_for
              - column:
                  name: status
