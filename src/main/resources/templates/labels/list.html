<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <title>Метки — RemindMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="main-content">
    <div class="container py-4" style="max-width: 640px;">
        <h2 class="fw-bold mb-4">Метки</h2>

        <div class="card rm-card mb-4">
            <div class="card-header fw-semibold"><i class="bi bi-plus-circle me-2"></i>Новая метка</div>
            <div class="card-body">
                <form th:action="@{/labels}" method="post" class="d-flex gap-2 align-items-end flex-wrap">
                    <div class="flex-grow-1">
                        <label class="form-label">Название</label>
                        <input type="text" name="name" class="form-control" placeholder="Работа, Личное..." required maxlength="50">
                    </div>
                    <div>
                        <label class="form-label">Цвет</label>
                        <input type="color" name="color" class="form-control form-control-color" value="#8b5cf6">
                    </div>
                    <button type="submit" class="btn btn-accent align-self-end">
                        <i class="bi bi-plus-lg me-1"></i>Добавить
                    </button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(labels)}" class="text-center py-4 empty-state">
            <i class="bi bi-tags display-3 text-muted"></i>
            <p class="mt-2 text-muted">Меток ещё нет</p>
        </div>

        <div class="card rm-card" th:unless="${#lists.isEmpty(labels)}">
            <ul class="list-group list-group-flush">
                <li class="list-group-item bg-transparent d-flex align-items-center justify-content-between py-3"
                    th:each="label : ${labels}">
                    <div class="d-flex align-items-center gap-3">
                        <span class="color-dot" th:style="'background-color:' + ${label.color}"></span>
                        <span class="fw-semibold" th:text="${label.name}">Метка</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-secondary"
                                th:attr="data-label-id=${label.id}, data-label-name=${label.name}, data-label-color=${label.color}"
                                onclick="editLabel(this)">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger"
                                th:attr="data-label-id=${label.id}"
                                onclick="deleteLabel(this)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</main>

<div class="modal fade" id="editLabelModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content rm-card border-0">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать метку</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" id="editLabelName" class="form-control" maxlength="50">
                </div>
                <div>
                    <label class="form-label">Цвет</label>
                    <input type="color" id="editLabelColor" class="form-control form-control-color">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-accent" onclick="saveLabelEdit()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
