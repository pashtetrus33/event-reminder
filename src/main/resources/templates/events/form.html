<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <title th:text="${editing} ? 'Редактировать событие — RemindMe' : 'Новое событие — RemindMe'">Событие</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="main-content">
    <div class="container py-4" style="max-width: 760px;">
        <div class="d-flex align-items-center mb-4">
            <a href="javascript:history.back()" class="btn btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0" th:text="${editing} ? 'Редактировать событие' : 'Новое событие'">Событие</h2>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="${editing} ? @{/events/{id}/edit(id=${event.id})} : @{/events/new}" method="post">
            <input type="hidden" name="timezone" id="timezoneField"
                   th:value="${event?.timezone}">

            <div class="card rm-card mb-3">
                <div class="card-header fw-semibold"><i class="bi bi-info-circle me-2"></i>Основное</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Название <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control"
                               th:value="${event?.title}" placeholder="Название события" required maxlength="200" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="3"
                                  placeholder="Опциональное описание" th:text="${event?.description}"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата и время <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="eventAt" class="form-control" required
                               th:value="${event != null} ? ${event.eventAtInput()} : ''">
                        <div class="form-text">Часовой пояс: <span id="clientTimezone"></span></div>
                    </div>
                    <div th:unless="${#lists.isEmpty(labels)}">
                        <label class="form-label">Метки</label>
                        <div class="d-flex flex-wrap gap-2 mt-1">
                            <div th:each="label : ${labels}" class="form-check">
                                <input class="form-check-input" type="checkbox" name="labelIds"
                                       th:value="${label.id}" th:id="'lbl-' + ${label.id}"
                                       th:checked="${event != null and event.labelIds.contains(label.id)}">
                                <label class="form-check-label" th:for="'lbl-' + ${label.id}">
                                    <span class="badge label-badge"
                                          th:style="'background-color:' + ${label.color}"
                                          th:text="${label.name}">метка</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card rm-card mb-3">
                <div class="card-header fw-semibold"><i class="bi bi-arrow-repeat me-2"></i>Повторение</div>
                <div class="card-body">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="recurringSwitch" name="recurring"
                               th:checked="${event?.recurring}"
                               onchange="toggleRecurrence(this.checked)">
                        <label class="form-check-label" for="recurringSwitch">Повторяющееся событие</label>
                    </div>
                    <div id="recurrenceFields" th:classappend="${event?.recurring} ? '' : ' d-none'">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Тип повтора</label>
                                <select name="recurrenceType" class="form-select">
                                    <option th:each="rt : ${recurrenceTypes}"
                                            th:value="${rt.name()}"
                                            th:text="${rt.displayName()}"
                                            th:selected="${event?.recurrenceType == rt}">тип</option>
                                </select>
                            </div>
                            <div class="col-sm-3">
                                <label class="form-label">Интервал</label>
                                <input type="number" name="recurrenceInterval" class="form-control" min="1"
                                       th:value="${event?.recurrenceInterval ?: 1}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card rm-card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-semibold"><i class="bi bi-bell me-2"></i>Напоминания</span>
                    <button type="button" class="btn btn-sm btn-outline-accent" onclick="addRuleRow()">
                        <i class="bi bi-plus me-1"></i>Добавить
                    </button>
                </div>
                <div class="card-body">
                    <div id="rulesContainer">
                        <p class="text-muted small mb-0" id="noRulesHint"
                           th:if="${rules == null or #lists.isEmpty(rules)}">
                            Нет напоминаний. Нажми «Добавить», чтобы настроить.
                        </p>
                        <div th:each="rule : ${rules}" class="rule-row d-flex gap-2 align-items-center mb-2">
                            <select name="ruleChannels" class="form-select form-select-sm w-auto">
                                <option value="EMAIL" th:selected="${rule.channel.name() == 'EMAIL'}">Email</option>
                                <option value="TELEGRAM" th:selected="${rule.channel.name() == 'TELEGRAM'}">Telegram</option>
                                <option value="BOTH">Email + Telegram</option>
                            </select>
                            <select name="ruleNotifyTypes" class="form-select form-select-sm w-auto" onchange="toggleMinutes(this)">
                                <option value="BEFORE" th:selected="${rule.notifyType.name() == 'BEFORE'}">за время до</option>
                                <option value="START_OF_DAY" th:selected="${rule.notifyType.name() == 'START_OF_DAY'}">в начале дня</option>
                            </select>
                            <input type="number" name="ruleMinutes" class="form-control form-control-sm"
                                   style="width:90px" placeholder="мин" min="0"
                                   th:value="${rule.notifyBeforeMinutes}"
                                   th:classappend="${rule.notifyType.name() == 'START_OF_DAY'} ? ' d-none' : ''">
                            <span class="text-muted small text-nowrap"
                                  th:classappend="${rule.notifyType.name() == 'START_OF_DAY'} ? ' d-none' : ''">повт. каждые</span>
                            <input type="number" name="ruleRepeatIntervals" class="form-control form-control-sm"
                                   style="width:80px" placeholder="мин" min="1"
                                   th:value="${rule.repeatIntervalMinutes}"
                                   th:classappend="${rule.notifyType.name() == 'START_OF_DAY'} ? ' d-none' : ''">
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    onclick="this.closest('.rule-row').remove(); checkNoRules()">
                                <i class="bi bi-x"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-accent px-4">
                    <i class="bi bi-check-lg me-2"></i>
                    <span th:text="${editing} ? 'Сохранить' : 'Создать'">Создать</span>
                </button>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
