<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — RemindMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-page">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-sm-9 col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <div class="brand-icon mb-3">
                    <i class="bi bi-bell-fill"></i>
                </div>
                <h1 class="h3 fw-bold text-gradient">RemindMe</h1>
            </div>

            <div class="card rm-card">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4">Создать аккаунт</h5>

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/register}" method="post" th:object="${registerRequest}">
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" th:field="*{username}" class="form-control" placeholder="username" autofocus required minlength="3" maxlength="50">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Минимум 6 символов" required minlength="6">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Повтор пароля</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Повторите пароль" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-accent w-100">
                            <i class="bi bi-person-plus me-2"></i>Зарегистрироваться
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-center mt-3 text-muted">
                Уже есть аккаунт? <a th:href="@{/login}" class="text-accent">Войти</a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
